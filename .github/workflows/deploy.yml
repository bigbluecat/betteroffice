name: Deploy

# Dispatched by release.yml after a successful publish, or manually.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [web, demo, docs, relay]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: dtolnay/rust-toolchain@stable
        id: rust
        if: matrix.app == 'demo'
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        if: matrix.app == 'demo'
        with:
          shared-key: wasm

      # rust-cache prunes the workspace's own artifacts, and wasm-opt costs minutes per module.
      - uses: actions/cache@v4
        if: matrix.app == 'demo'
        with:
          path: target/wasm-pack
          key: wasm-pack-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'scripts/*wasm*.ts') }}

      - uses: taiki-e/install-action@v2
        if: matrix.app == 'demo'
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The demo's prebuild builds the wasm and the packages it needs; a step here would repeat it.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --filter './apps/${{ matrix.app }}' deploy
