name: Python

on:
  pull_request:
    paths:
      - "bindings/python/**"
      - "crates/**"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths:
      - "bindings/python/**"
      - "crates/**"
      - ".github/workflows/python.yml"
  workflow_call:

permissions:
  contents: read

# Superseding pushes cancel a PR's run; release and push runs get a unique
# group so a redundant CI run never queues ahead of a publish.
concurrency:
  group: python-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python

      - name: Install build and test dependencies
        run: python -m pip install --upgrade "maturin>=1.7,<2.0" pytest mypy

      - name: Build and install the extension
        working-directory: bindings/python
        run: maturin develop

      - name: Lint Rust
        working-directory: bindings/python
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Type check
        working-directory: bindings/python
        run: mypy --strict python/betteroffice_xlsx

      - name: Test
        working-directory: bindings/python
        run: pytest -q

  wheels:
    name: Wheel (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `smoke` is false wherever the wheel is cross-compiled and therefore
        # not installable on the runner that built it. macos-latest is arm64,
        # so its x86_64 wheel is cross-built too.
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            smoke: true
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2014"
            smoke: false
          - os: macos-latest
            target: aarch64
            manylinux: auto
            smoke: true
          - os: macos-latest
            target: x86_64
            manylinux: auto
            smoke: false
          - os: windows-latest
            target: x64
            manylinux: auto
            smoke: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: bindings/python
          sccache: "true"

      - name: Smoke test the wheel
        if: matrix.smoke
        working-directory: bindings/python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links dist betteroffice-xlsx
          python scripts/smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: bindings/python/dist
